<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKLN - Shopping Cart</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
  />

  <link rel="stylesheet" href="css/styles.css" />

  <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"
  ></script>

  <link
          href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
          rel="stylesheet"
  />

  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
  />
</head>
<body>
<nav
        class="navbar navbar-expand-lg navbar-dark fixed-top ps-3"
        style="background-color: black"
>
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">AKLN</a>
    <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item dropdown">
          <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  id="navbarDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
          >
            Categories
          </a>
          <ul
                  class="dropdown-menu"
                  id="dropdownMenu"
                  aria-labelledby="navbarDropdown"
          ></ul>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="cart.html">
            Cart <span id="cart-counter" class="badge bg-danger rounded-pill">0</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-5">
  <h2 class="mb-4">Your Shopping Cart</h2>

  <div id="cart-empty-message" class="alert alert-info d-none">
    Your cart is empty. <a href="index.html" class="alert-link">Continue shopping</a>
  </div>

  <div id="cart-container">
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-dark">
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody id="cart-items">
        </tbody>
      </table>
    </div>

    <div class="row mt-4">
      <div class="col-md-6">
        <a href="index.html" class="btn btn-outline-dark">
          <i class="fas fa-arrow-left me-2"></i>Continue Shopping
        </a>
        <button id="clear-cart" class="btn btn-outline-danger ms-2">
          <i class="fas fa-trash me-2"></i>Clear Cart
        </button>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Order Summary</h5>
            <div class="d-flex justify-content-between">
              <span>Subtotal:</span>
              <span id="cart-subtotal">0kr</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between">
              <span><strong>Total:</strong></span>
              <span id="cart-total"><strong>0kr</strong></span>
            </div>
            <button id="checkout-button" class="btn btn-dark w-100 mt-3">
              Proceed to Checkout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-4">
  <p>&copy; 2025 AKLN. All rights reserved.</p>
</footer>

<script type="module" src="js/cart-page.js"></script>
<script type="module">
  import { fetchCategories } from './js/fetch-data.js';
  fetchCategories();
</script>
</body>
</html>
